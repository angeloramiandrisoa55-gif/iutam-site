# Mises à jour automatiques des dépendances et des actions GitHub.
# Le projet n'a pas de dépendance de production ; cette surveillance couvre
# les outils Ponctuels (decap-server, wrangler, serve) et les actions utilisées
# dans les workflows.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels:
      - maintenance
      - dependabot

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels:
      - maintenance
      - dependabot
