name: Contrôles de sécurité

# Analyse automatique du dépôt et du site construit :
#   - recherche de secrets accidentellement commités
#   - vérification des en-têtes de sécurité du site déployé
#   - audit des dépendances npm
#   - vérifications de configuration (CSP, HTTPS, absence de PHP)

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'   # chaque lundi
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  secrets:
    name: Recherche de secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Vérifier qu'aucun secret n'est présent dans le dépôt
        run: |
          set -e
          found=0
          # Mots de passe, clés et jetons en clair (hors documentation et exemples)
          if grep -rInE '(BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9]{36,}|xox[baprs]-[A-Za-z0-9-]{10,})' \
               --exclude-dir=.git --exclude-dir=node_modules . ; then
            echo "::error::Secret détecté dans le dépôt — révoquez-le immédiatement."
            found=1
          fi
          if [ "$found" -ne 0 ]; then exit 1; fi
          echo "Aucun secret détecté."

      - name: Vérifier que les fichiers sensibles sont ignorés
        run: |
          set -e
          for f in .env .env.local node_modules _site backup; do
            if git ls-files --error-unmatch "$f" > /dev/null 2>&1; then
              echo "::error::$f est versionné alors qu'il ne devrait pas l'être."
              exit 1
            fi
          done
          echo "Fichiers sensibles correctement ignorés."

  dependencies:
    name: Audit des dépendances
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - run: npm audit --audit-level=moderate || echo "::warning::npm audit a signalé des éléments à examiner."

  config:
    name: Vérification de la configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Contrôler les en-têtes de sécurité déclarés
        run: |
          set -e
          for h in Content-Security-Policy X-Content-Type-Options Strict-Transport-Security X-Frame-Options Referrer-Policy Permissions-Policy; do
            if grep -q "$h" _headers && grep -q "$h" .htaccess && grep -q "$h" web.config; then
              echo "OK  $h"
            else
              echo "::error::$h manquant dans un des fichiers de configuration."
              exit 1
            fi
          done

      - name: Contrôler que le site ne contient ni PHP ni base de données
        run: |
          set -e
          if find . -path ./node_modules -prune -o -type f \( -name '*.php' -o -name '*.sql' -o -name '.env' \) -print | grep -q .; then
            echo "::error::Fichier exécutable ou base de données trouvé dans un site statique."
            exit 1
          fi
          echo "Aucune dépendance serveur inutile."

      - name: Vérifier l'API JSON
        run: |
          node tools/build-api.js
          for f in api/*.json; do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" && echo "OK  $f"
          done
