# Auto-hébergement du site IUTAM avec Caddy (HTTPS automatique Let's Encrypt)
# -----------------------------------------------------------------------------
# Utile si l'IUTAM veut maîtriser son hébergement (serveur de l'Université, VPS)
# tout en gardant le HTTPS gratuit et automatique.
#
# Démarrage :
#   docker compose up -d
#   docker compose logs -f caddy
#
# Le certificat est obtenu automatiquement au premier accès, à condition que
# le nom de domaine pointe déjà vers l'IP du serveur (port 80 et 443 ouverts).
#
# Pour un hébergement mutualisé classique (cPanel/Nimbus), utilisez plutôt
# .htaccess fourni — voir docs/HEBERGEMENT-UNIVERSITE.md.

services:
  caddy:
    image: caddy:2-alpine
    container_name: iutam-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ../_site:/srv:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  caddy_data:
  caddy_config:
